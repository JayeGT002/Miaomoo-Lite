[package]
name = "miaomoo-lite"
version = "0.1.4"
license = "MIT"
description = "Miaomoo Lite — 仿 Bear 的所见即所得 Markdown 笔记编辑器"
authors = ["JayeGT002"]
edition = "2021"

[lib]
name = "miaomoo_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font-kit = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
