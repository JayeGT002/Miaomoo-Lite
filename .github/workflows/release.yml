name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tagName:
        description: '发布标签（如 v0.1.0）'
        required: true
        default: 'v0.1.0'

jobs:
  tauri-build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64') && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Fetch Typst sidecar (macOS / Linux)
        if: matrix.platform != 'windows-latest'
        shell: bash
        working-directory: app/src-tauri
        run: |
          # Linux：typst 官方只发布 musl 静态包，下载后按 gnu triple 命名以匹配 externalBin
          case "${{ matrix.args }}" in
            *aarch64-apple-darwin*) PKG=aarch64-apple-darwin; TRIPLE=aarch64-apple-darwin ;;
            *x86_64-apple-darwin*)  PKG=x86_64-apple-darwin;  TRIPLE=x86_64-apple-darwin ;;
            *)                      PKG=x86_64-unknown-linux-musl; TRIPLE=x86_64-unknown-linux-gnu ;;
          esac
          curl -fL "https://github.com/typst/typst/releases/latest/download/typst-${PKG}.tar.xz" | tar xJ
          mkdir -p binaries
          cp "typst-${PKG}/typst" "binaries/typst-${TRIPLE}"
          chmod +x "binaries/typst-${TRIPLE}"

      - name: Fetch Typst sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        working-directory: app/src-tauri
        run: |
          $triple = "x86_64-pc-windows-msvc"
          curl.exe -fL -o typst.zip "https://github.com/typst/typst/releases/latest/download/typst-$triple.zip"
          Expand-Archive typst.zip -DestinationPath .
          New-Item -ItemType Directory -Force -Path binaries
          Copy-Item "typst-$triple/typst.exe" "binaries/typst-$triple.exe"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ inputs.tagName || github.ref_name }}
          releaseName: 'Miaomoo Lite ${{ inputs.tagName || github.ref_name }}'
          releaseBody: '预览版（Preview）。macOS 未签名，首次打开请右键选择"打开"；Windows 未签名，SmartScreen 提示时选择"仍要运行"。'
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
